name: Deploy

# 本番（shintakeda.jp）へのデプロイは手動実行のみ。
# mainへのpushはGitHub Pages（テストプレビュー）だけを更新する。
# 本番反映するとき: gh workflow run deploy.yml
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: SSH鍵を設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: rsyncでデプロイ（追加・更新・削除を同期）
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            ./ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_SERVER_DIR }}
