name: SFTP Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: SSH鍵を設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: lftp をインストール
        run: sudo apt-get install -y lftp

      - name: SFTPでさくらサーバーにデプロイ
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -i /home/runner/.ssh/deploy_key -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes';
            open sftp://$FTP_USERNAME@$FTP_HOST;
            mirror -R --delete --ignore-time \
              --exclude=^\.git \
              --exclude=^README\.md \
              --exclude=^\.github \
              . $FTP_SERVER_DIR;
            bye
          "
