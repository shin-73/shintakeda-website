name: SFTP Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: SSH鍵を設定
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.FTP_HOST }} >> ~/.ssh/known_hosts

      - name: lftp をインストール
        run: sudo apt-get install -y lftp

      - name: SFTPでさくらサーバーにデプロイ
        run: |
          lftp -e "
            set sftp:connect-program 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no';
            open sftp://${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_HOST }};
            mirror -R --delete --ignore-time \
              --exclude=^\.git \
              --exclude=^README\.md \
              --exclude=^\.github \
              . ${{ secrets.FTP_SERVER_DIR }};
            bye
          "
